<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis - Speech to Speech</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="controls-pane">
            <div class="controls-left">
                <button id="start-btn">Start</button>
                <div class="status" id="user-status">Inactive</div>
            </div>
            <div class="controls-right">
                <div class="status" id="llm-status">Waiting</div>
                <button id="reset-btn" onclick="resetConversation()">Reset</button>
            </div>
        </div>
        <div class="service-status-bar">
            <div class="service-status-item" id="status-vad" title="Voice Activity Detection">
                <span class="service-dot" id="dot-vad"></span>
                <span class="service-label">VAD</span>
            </div>
            <div class="service-status-item" id="status-stt" title="Speech-to-Text">
                <span class="service-dot" id="dot-stt"></span>
                <span class="service-label">STT</span>
            </div>
            <div class="service-status-item" id="status-llm" title="Language Model">
                <span class="service-dot" id="dot-llm"></span>
                <span class="service-label">LLM</span>
            </div>
            <div class="service-status-item" id="status-tts" title="Text-to-Speech">
                <span class="service-dot" id="dot-tts"></span>
                <span class="service-label">TTS</span>
            </div>
            <div class="service-status-item" id="status-websocket" title="Web Connection">
                <span class="service-dot" id="dot-websocket"></span>
                <span class="service-label">Web</span>
            </div>
        </div>
        <div class="conversation-pane" id="conversation-history"></div>
    </div>

    <script>
        const HEARTBEAT_TIMEOUT = 15000;
        const serviceHeartbeatTimers = { vad: null, stt: null, llm: null, tts: null };
        const serviceLastHeartbeat = { vad: 0, stt: 0, llm: 0, tts: 0 };

        function resetServiceHeartbeat(svc) {
            if (!serviceLastHeartbeat[svc]) return;
            if (serviceHeartbeatTimers[svc]) {
                clearTimeout(serviceHeartbeatTimers[svc]);
                serviceHeartbeatTimers[svc] = null;
            }
            serviceLastHeartbeat[svc] = Date.now();
        }

        function startServiceHeartbeatTimeout(svc) {
            if (!serviceLastHeartbeat[svc]) {
                serviceLastHeartbeat[svc] = Date.now();
            }
            if (serviceHeartbeatTimers[svc]) {
                clearTimeout(serviceHeartbeatTimers[svc]);
            }
            serviceHeartbeatTimers[svc] = setTimeout(() => {
                const dot = document.getElementById(`dot-${svc}`);
                if (dot && dot.classList.contains('active')) {
                    dot.className = 'service-dot offline';
                    console.log(`Service ${svc} heartbeat timeout, marking offline`);
                }
                serviceHeartbeatTimers[svc] = null;
            }, HEARTBEAT_TIMEOUT);
        }

        const startBtn = document.getElementById('start-btn');
        const conversationHistory = document.getElementById('conversation-history');
        const llmHistory = document.getElementById('llm-history');
        const userStatus = document.getElementById('user-status');
        const llmStatus = document.getElementById('llm-status');

        let isRunning = false;
        let audioContext = null;
        let mediaStream = null;
        let processor = null;
        let ws = null;
        let audioSinkId = null;

        // Audio playback with ordering
        let audioQueue = [];
        let isPlaying = false;
        let currentAudioBuffer = null;
        let audioContextForPlayback = null;
        let expectedNextSeq = 0;
        let pendingAudioBuffers = [];
        let currentMessageSeq = 0;
        let currentTurnId = 0;
        let previousTurnId = 0;

        // WebSocket connections
        const origin = window.location.origin.replace(/^http/, 'ws');
        const VAD_WS_URL = `${origin}/vad`;
        const TTS_WS_URL = `${origin}/tts`;

        // Conversation tracking
        let userMessageCount = 0;
        let llmMessageCount = 0;
        let currentPartialText = '';
        let currentPartialSeq = -1;
        let isLLMResponding = false;
        let lastUserMessageId = null;
        let activeLlmMessageId = null;

        function appendUserMessage(text) {
            const row = document.createElement('div');
            row.className = 'message-row user';
            row.id = `user-msg-${userMessageCount}`;
            row.innerHTML = `<div class="message-bubble"><div class="message-label">User</div><div class="message-text">${escapeHtml(text)}</div></div>`;
            conversationHistory.appendChild(row);
            conversationHistory.scrollTop = conversationHistory.scrollHeight;
        }

        function appendLLMMessage(text) {
            llmMessageCount++;
            const row = document.createElement('div');
            row.className = 'message-row llm';
            row.id = `llm-msg-${llmMessageCount}`;
            activeLlmMessageId = row.id;
            row.innerHTML = `<div class="message-bubble"><div class="message-label">LLM</div><div class="message-text">${escapeHtml(text)}</div></div>`;
            conversationHistory.appendChild(row);
            const divider = document.createElement('div');
            divider.className = 'message-divider';
            conversationHistory.appendChild(divider);
            conversationHistory.scrollTop = conversationHistory.scrollHeight;
        }

        function updateUserMessage(seq, text) {
            let msgEl = null;
            if (lastUserMessageId) {
                msgEl = document.getElementById(lastUserMessageId);
            }
            if (!msgEl) {
                userMessageCount++;
                const row = document.createElement('div');
                row.className = 'message-row user';
                row.id = `user-msg-${userMessageCount}`;
                row.innerHTML = `<div class="message-bubble"><div class="message-label">User</div><div class="message-text">${escapeHtml(text)}</div></div>`;
                conversationHistory.appendChild(row);
                lastUserMessageId = `user-msg-${userMessageCount}`;
                msgEl = row;
            }
            const textEl = msgEl.querySelector('.message-text');
            textEl.textContent = text;
            conversationHistory.scrollTop = conversationHistory.scrollHeight;
        }

        function finalizeUserMessage() {
            lastUserMessageId = null;
        }

        function updateLLMStreaming(seq, text) {
            let msgEl = null;
            if (activeLlmMessageId) {
                msgEl = document.getElementById(activeLlmMessageId);
            }
            const llmMsgs = Array.from(conversationHistory.querySelectorAll('.message-row.llm')).map(el => ({
                id: el.id,
                text: el.querySelector('.message-text')?.textContent?.substring(0, 50) || '(empty)'
            }));
            console.log('[LLM-STREAM] updateLLMStreaming:', { 
                activeLlmMessageId, msgEl: msgEl ? msgEl.id : 'null', 
                llmMessageCount, textLen: text.length, 
                allLlmMsgs: llmMsgs, 
                domChildren: conversationHistory.children.length 
            });
            if (!msgEl) {
                console.log('[LLM-STREAM] Creating new LLM message');
                appendLLMMessage(text);
                setLLMCursor(true);
                return;
            }
            const textEl = msgEl.querySelector('.message-text');
            textEl.textContent = text;
            conversationHistory.scrollTop = conversationHistory.scrollHeight;
        }

        function createMessageRow(className, id, labelText, text) {
            const row = document.createElement('div');
            row.className = className;
            row.id = id;
            row.innerHTML = `<div class="message-bubble"><div class="message-label">${labelText}</div><div class="message-text">${escapeHtml(text)}</div></div>`;
            conversationHistory.appendChild(row);
            conversationHistory.scrollTop = conversationHistory.scrollHeight;
            return row;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearHistory() {
            conversationHistory.innerHTML = '';
            if (llmHistory) llmHistory.innerHTML = '';
            activeLlmMessageId = null;
            lastUserMessageId = null;
        }

        function clearPendingAudioBuffers() {
            pendingAudioBuffers = [];
            expectedNextSeq = 0;
            currentTurnId = 0;
        }

        function setLLMCursor(show) {
             const currentMsg = activeLlmMessageId ? document.getElementById(activeLlmMessageId) : null;
             if (!currentMsg) return;
             let cursor = currentMsg.querySelector('.cursor');
             if (show) {
                 if (!cursor) {
                     cursor = document.createElement('span');
                     cursor.className = 'cursor';
                     const textEl = currentMsg.querySelector('.message-text');
                     if (textEl) {
                         textEl.appendChild(cursor);
                     }
                 }
             } else if (cursor) {
                 cursor.remove();
             }
         }

        // Audio capture
        async function startAudioCapture() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('Microphone not supported in this browser.');
                return;
            }
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: 16000
                });
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,
                        sampleRate: 16000
                    }
                });

                const source = audioContext.createMediaStreamSource(mediaStream);
                processor = audioContext.createScriptProcessor(1024, 1, 1);

                processor.onaudioprocess = (e) => {
                    if (!ws || ws.readyState !== WebSocket.OPEN) return;
                    const inputData = e.inputBuffer.getChannelData(0);
                    const float32Data = new Float32Array(inputData.length);
                    for (let i = 0; i < inputData.length; i++) {
                        float32Data[i] = inputData[i];
                    }
                    const int16Data = new Int16Array(float32Data.length);
                    for (let i = 0; i < float32Data.length; i++) {
                        const s = Math.max(-1, Math.min(1, float32Data[i]));
                        int16Data[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }
                    ws.send(int16Data.buffer);
                };

                source.connect(processor);
                processor.connect(audioContext.destination);
            } catch (err) {
                console.error('Audio capture error:', err);
                alert('Microphone access denied or error: ' + err.message);
            }
        }

        function stopAudioCapture() {
            if (processor) {
                processor.disconnect();
                processor = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
        }

        // Audio playback with sequence-based ordering
        function initPlaybackContext() {
            if (!audioContextForPlayback) {
                audioContextForPlayback = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function enqueueAudioChunk(base64Data, seq) {
            if (!base64Data) return;
            
            initPlaybackContext();
            if (audioContextForPlayback.state === 'suspended') {
                audioContextForPlayback.resume();
            }

            const binaryString = atob(base64Data);
            const uint8 = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                uint8[i] = binaryString.charCodeAt(i);
            }
            const samples = new Float32Array(uint8.buffer, uint8.byteOffset, uint8.byteLength / 4);

            const buffer = audioContextForPlayback.createBuffer(1, samples.length, 16000);
            buffer.getChannelData(0).set(samples);

            pendingAudioBuffers.push({ buffer, seq });
            sortAndPlayPending();
        }

        function sortAndPlayPending() {
            if (pendingAudioBuffers.length === 0) {
                return;
            }

            pendingAudioBuffers.sort((a, b) => a.seq - b.seq);

            while (pendingAudioBuffers.length > 0 && pendingAudioBuffers[0].seq === expectedNextSeq) {
                const item = pendingAudioBuffers.shift();
                audioQueue.push(item.buffer);
                expectedNextSeq++;
            }

            if (!isPlaying && audioQueue.length > 0) {
                playNextBuffer();
            }
        }

        function playNextBuffer() {
            if (audioQueue.length === 0) {
                isPlaying = false;
                llmStatus.textContent = 'Idle';
                return;
            }

            isPlaying = true;
            llmStatus.textContent = 'Speaking...';
            startBtn.classList.add('speaking');

            currentAudioBuffer = audioQueue.shift();
            if (audioSource) {
                try { audioSource.stop(); } catch(e) {}
            }

            audioSource = audioContextForPlayback.createBufferSource();
            audioSource.buffer = currentAudioBuffer;
            audioSource.connect(audioContextForPlayback.destination);

            audioSource.onended = () => {
                audioSource = null;
                currentAudioBuffer = null;
                playNextBuffer();
            };

            audioSource.start();
        }

        function stopPlayback() {
            if (audioSource) {
                try { audioSource.stop(); } catch(e) {}
                audioSource = null;
            }
            audioQueue = [];
            pendingAudioBuffers = [];
            currentAudioBuffer = null;
            isPlaying = false;
            expectedNextSeq = 0;
            currentTurnId = 0;
            previousTurnId = 0;
            llmStatus.textContent = 'Idle';
            startBtn.classList.remove('speaking');
        }

      function resetConversation() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'reset' }));
            }
            llmMessageCount = 0;
            userMessageCount = 0;
            currentPartialText = '';
            currentPartialSeq = -1;
            clearHistory();
            stopPlayback();
            llmStatus.textContent = 'Waiting';
            setLLMCursor(false);
            isLLMResponding = false;
            currentTurnId = 0;
            previousTurnId = 0;
            activeLlmMessageId = null;
            lastUserMessageId = null;
        }

        // WebSocket connections
        function connectVAD() {
            ws = new WebSocket(VAD_WS_URL);

            ws.onopen = () => {
                console.log('VAD WebSocket connected');
                const dot = document.getElementById('dot-websocket');
                if (dot) {
                    dot.className = 'service-dot idle';
                }
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                switch (data.type) {
                    case 'user_transcript':
                    case 'user_partial':
                        if (data.type === 'user_partial') {
                            currentPartialText = data.text;
                            updateUserMessage(data.chunk_id || 0, data.text);
                        } else {
                            updateUserMessage(data.chunk_id || 0, data.text);
                            finalizeUserMessage();
                            currentPartialText = '';
                        }
                        break;

                    case 'llm_transcript':
                         console.log('[WS] llm_transcript:', { final: data.final, partial: data.partial, turn_id: data.turn_id, textLen: data.text?.length, activeLlmMessageId, llmMessageCount, domChildren: conversationHistory.children.length });
                         if (data.final) {
                             console.log('[WS] llm_transcript FINAL: updating existing message or creating fallback');
                             if (activeLlmMessageId) {
                                 const msgEl = document.getElementById(activeLlmMessageId);
                                 if (msgEl) {
                                     console.log('[WS] llm_transcript: found active message element, setting text');
                                     const textEl = msgEl.querySelector('.message-text');
                                     textEl.textContent = data.text;
                                     setLLMCursor(false);
                                 } else {
                                     console.log('[WS] llm_transcript: activeLlmMessageId element not in DOM!');
                                 }
                             } else {
                                 console.log('[WS] llm_transcript: no activeLlmMessageId, creating new message');
                                 appendLLMMessage(data.text);
                                 setLLMCursor(false);
                             }
                             isLLMResponding = false;
                         } else if (data.partial) {
                             updateLLMStreaming(data.turn_id !== undefined ? data.turn_id : -1, data.text);
                             isLLMResponding = true;
                         }
                         break;

                    case 'llm_audio':
                        if (data.turn_id !== undefined) {
                            if (data.turn_id !== previousTurnId && data.turn_id !== currentTurnId + 1) {
                                clearPendingAudioBuffers();
                                previousTurnId = currentTurnId;
                            }
                            currentTurnId = data.turn_id;
                        }
                        const audioSeq = data.audio_seq !== undefined ? data.audio_seq : expectedNextSeq;
                        enqueueAudioChunk(data.audio, audioSeq);
                        break;

                    case 'user_start':
                        userStatus.textContent = 'Listening...';
                        userMessageCount = 0;
                        llmMessageCount = 0;
                        currentPartialText = '';
                        currentPartialSeq = -1;
                        clearHistory();
                        break;

                    case 'user_end':
                        userStatus.textContent = 'Processing...';
                        break;

                      case 'llm_start':
                         console.log('[WS] llm_start:', { turn_id: data.turn_id, activeLlmMessageId, llmMessageCount, domChildren: conversationHistory.children.length });
                         currentTurnId = data.turn_id || 0;
                         previousTurnId = 0;
                         llmMessageCount = 0;
                         clearPendingAudioBuffers();
                         if (activeLlmMessageId) {
                             const oldMsg = document.getElementById(activeLlmMessageId);
                             if (oldMsg) {
                                 console.log('[WS] llm_start: removing old message', activeLlmMessageId);
                                 oldMsg.remove();
                             } else {
                                 console.log('[WS] llm_start: activeLlmMessageId element not in DOM');
                             }
                             const oldDivider = oldMsg?.nextElementSibling;
                             if (oldDivider && oldDivider.classList.contains('message-divider')) {
                                 oldDivider.remove();
                             }
                             activeLlmMessageId = null;
                         } else {
                             console.log('[WS] llm_start: no activeLlmMessageId, nothing to clear');
                         }
                         console.log('[WS] llm_start: done, activeLlmMessageId=', activeLlmMessageId);
                         llmStatus.textContent = 'Thinking...';
                         isLLMResponding = true;
 			console.log("Reached llmMessageCount: " + String(llmMessageCount))
                         break;

                    case 'llm_end':
                        llmStatus.textContent = 'Idle';
                        if (data.turn_id) {
                            previousTurnId = data.turn_id;
                        }
                        const llmMsgEl = activeLlmMessageId ? document.getElementById(activeLlmMessageId) : null;
                        if (llmMsgEl) {
                            setLLMCursor(false);
                            const textEl = llmMsgEl.querySelector('.message-text');
                            if (textEl && textEl.textContent.trim() === '') {
                                const textFromServer = data.text || '';
                                if (textFromServer) {
                                    textEl.textContent = textFromServer;
                                } else {
                                    llmMsgEl.remove();
                                    const divider = llmMsgEl.nextElementSibling;
                                    if (divider && divider.classList.contains('message-divider')) {
                                        divider.remove();
                                    }
                                    llmMessageCount = Math.max(0, llmMessageCount - 1);
                                }
                            }
                        }
                        activeLlmMessageId = null;
                        break;

                    case 'interrupt':
                        stopPlayback();
                        currentPartialText = '';
                        isLLMResponding = false;
                        currentTurnId = 0;
                        previousTurnId = 0;
                        break;

                    case 'audio_complete':
                        if (data.turn_id) {
                            previousTurnId = data.turn_id;
                        }
                        break;

                    case 'service_status':
                        const svc = data.service;
                        const svcStatus = data.status;
                        const dot = document.getElementById(`dot-${svc}`);
                        if (dot) {
                            dot.className = 'service-dot';
                            if (svcStatus === 'active') {
                                dot.classList.add('active');
                            } else if (svcStatus === 'idle') {
                                dot.classList.add('idle');
                            } else {
                                dot.classList.add('offline');
                            }
                        }
                        if (serviceLastHeartbeat[svc] !== undefined) {
                            resetServiceHeartbeat(svc);
                            startServiceHeartbeatTimeout(svc);
                        }
                        break;

                    case 'reset_complete':
                        llmMessageCount = 0;
                        userMessageCount = 0;
                        currentPartialText = '';
                        currentPartialSeq = -1;
                        clearHistory();
                        stopPlayback();
                        setLLMCursor(false);
                        isLLMResponding = false;
                        currentTurnId = 0;
                        previousTurnId = 0;
                        break;
                }
            };

            ws.onclose = () => {
                console.log('VAD WebSocket disconnected, reconnecting...');
                userStatus.textContent = 'Reconnecting...';
                const dot = document.getElementById('dot-websocket');
                if (dot) {
                    dot.className = 'service-dot offline';
                }
                setTimeout(connectVAD, 2000);
            };

            ws.onerror = (err) => {
                console.error('VAD WebSocket error:', err);
            };
        }

        // Main toggle
        startBtn.addEventListener('click', async () => {
            if (!isRunning) {
                isRunning = true;
                startBtn.textContent = 'Stop';
                startBtn.classList.add('active', 'listening');
                userStatus.textContent = 'Starting...';
                llmStatus.textContent = 'Waiting';

                await startAudioCapture();
                connectVAD();
                 } else {
                isRunning = false;
                startBtn.textContent = 'Start';
                startBtn.classList.remove('active', 'listening', 'speaking');
                userStatus.textContent = 'Inactive';
                llmStatus.textContent = 'Waiting';

                stopAudioCapture();
                stopPlayback();

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'stop' }));
                    ws.send(JSON.stringify({ type: 'interrupt' }));
                }
                
                llmMessageCount = 0;
                userMessageCount = 0;
                currentPartialText = '';
                currentPartialSeq = -1;
                clearHistory();
                setLLMCursor(false);
                isLLMResponding = false;
                currentTurnId = 0;
                previousTurnId = 0;
            }
        });
    </script>
</body>
</html>
