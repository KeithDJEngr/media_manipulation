<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis - Speech to Speech</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="controls-pane">
            <div class="controls-left">
                <button id="start-btn">Start</button>
                <div class="status" id="user-status">Inactive</div>
            </div>
            <div class="controls-right">
                <div class="status" id="llm-status">Waiting</div>
                <button id="reset-btn" onclick="resetConversation()">Reset</button>
                <button id="export-btn" onclick="exportConversation()" title="Export conversation">Export</button>
                <button id="settings-btn" onclick="toggleSettings()" title="Settings">⚙️</button>
            </div>
        </div>
        <div class="service-status-bar">
            <div class="service-status-item" id="status-vad" title="Voice Activity Detection">
                <span class="service-dot" id="dot-vad"></span>
                <span class="service-label">VAD</span>
            </div>
            <div class="service-status-item" id="status-stt" title="Speech-to-Text">
                <span class="service-dot" id="dot-stt"></span>
                <span class="service-label">STT</span>
            </div>
            <div class="service-status-item" id="status-llm" title="Language Model">
                <span class="service-dot" id="dot-llm"></span>
                <span class="service-label">LLM</span>
            </div>
            <div class="service-status-item" id="status-tts" title="Text-to-Speech">
                <span class="service-dot" id="dot-tts"></span>
                <span class="service-label">TTS</span>
            </div>
            <div class="service-status-item" id="status-websocket" title="Web Connection">
                <span class="service-dot" id="dot-websocket"></span>
                <span class="service-label">Web</span>
            </div>
        </div>
        <div class="conversation-pane" id="conversation-history"></div>
        <div class="settings-overlay" id="settings-overlay" onclick="if(event.target===this)toggleSettings()">
            <div class="settings-panel">
                <div class="settings-header">
                    <h2>Settings</h2>
                    <button class="settings-close" onclick="toggleSettings()">✕</button>
                </div>
                <div class="settings-content">
                    <div class="settings-group">
                        <h3>TTS Voice</h3>
                        <select id="tts-voice" onchange="updateSetting('tts_voice', this.value)">
                            <option value="eric">Eric (Male)</option>
                            <option value="sarah">Sarah (Female)</option>
                            <option value="james">James (Male)</option>
                            <option value="emma">Emma (Female)</option>
                            <option value="custom">Custom...</option>
                        </select>
                        <input type="text" id="tts-voice-custom" placeholder="Custom speaker name" style="display:none;" oninput="updateSetting('tts_voice', this.value)">
                    </div>
                    <div class="settings-group">
                        <h3>Audio Quality</h3>
                        <select id="audio-sample-rate" onchange="updateSetting('sample_rate', this.value)">
                            <option value="16000">16 kHz (Standard)</option>
                            <option value="22050">22.05 kHz (Better)</option>
                            <option value="44100">44.1 kHz (High)</option>
                        </select>
                    </div>
                    <div class="settings-group">
                        <h3>System Prompt</h3>
                        <textarea id="system-prompt" rows="4" placeholder="Enter custom system prompt..." oninput="updateSetting('system_prompt', this.value)"></textarea>
                    </div>
                    <div class="settings-group">
                        <h3>Wake Word Detection</h3>
                        <label class="toggle-switch">
                            <input type="checkbox" id="wake-word-toggle" onchange="updateSetting('wake_word', this.checked)">
                            <span class="toggle-slider"></span>
                        </label>
                        <span class="toggle-label">Always-listening mode (when enabled, audio continues after speech ends)</span>
                    </div>
                    <div class="settings-group">
                        <h3>TTS Voice Instruct</h3>
                        <input type="text" id="tts-instruct" placeholder="e.g., Speak in a calm, natural tone" oninput="updateSetting('tts_instruct', this.value)">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const HEARTBEAT_TIMEOUT = 15000;
        const serviceHeartbeatTimers = { vad: null, stt: null, llm: null, tts: null };
        const serviceLastHeartbeat = { vad: 0, stt: 0, llm: 0, tts: 0 };

        function resetServiceHeartbeat(svc) {
            if (!serviceLastHeartbeat[svc]) return;
            if (serviceHeartbeatTimers[svc]) {
                clearTimeout(serviceHeartbeatTimers[svc]);
                serviceHeartbeatTimers[svc] = null;
            }
            serviceLastHeartbeat[svc] = Date.now();
        }

        function startServiceHeartbeatTimeout(svc) {
            if (!serviceLastHeartbeat[svc]) {
                serviceLastHeartbeat[svc] = Date.now();
            }
            if (serviceHeartbeatTimers[svc]) {
                clearTimeout(serviceHeartbeatTimers[svc]);
            }
            serviceHeartbeatTimers[svc] = setTimeout(() => {
                const dot = document.getElementById(`dot-${svc}`);
                if (dot && dot.classList.contains('active')) {
                    dot.className = 'service-dot offline';
                    console.log(`Service ${svc} heartbeat timeout, marking offline`);
                }
                serviceHeartbeatTimers[svc] = null;
            }, HEARTBEAT_TIMEOUT);
        }

        const startBtn = document.getElementById('start-btn');
        const conversationHistory = document.getElementById('conversation-history');
        const llmHistory = document.getElementById('llm-history');
        const userStatus = document.getElementById('user-status');
        const llmStatus = document.getElementById('llm-status');

        let isRunning = false;
        let audioContext = null;
        let mediaStream = null;
        let processor = null;
        let ws = null;
        let audioSinkId = null;

        // Audio playback with ordering
        let audioQueue = [];
        let isPlaying = false;
        let currentAudioBuffer = null;
        let audioContextForPlayback = null;
        let audioSource = null;
        let expectedNextSeq = 0;
        let pendingAudioBuffers = [];
        let currentMessageSeq = 0;
        let currentTurnId = 0;
        let previousTurnId = 0;
        let lastAudioCompleteSeq = -1;
        let turnSeqStart = {};

        // WebSocket connections
        const origin = window.location.origin.replace(/^http/, 'ws');
        const VAD_WS_URL = `${origin}/vad`;
        const TTS_WS_URL = `${origin}/tts`;

        // Conversation tracking
        let userMessageCount = 0;
        let llmMessageCount = 0;
        let currentPartialText = '';
        let currentPartialSeq = -1;
        let isLLMResponding = false;
        let lastUserMessageId = null;
        let activeLlmMessageId = null;

        function appendUserMessage(text) {
            userMessageCount++;
            const row = document.createElement('div');
            row.className = 'message-row user';
            row.id = `user-msg-${userMessageCount}`;
            row.innerHTML = `<div class="message-bubble"><div class="message-label">User</div><div class="message-text">${escapeHtml(text)}</div><button class="copy-btn" onclick="copyMessage('${row.id}')" title="Copy to clipboard">📋</button></div>`;
            conversationHistory.appendChild(row);
            conversationHistory.scrollTop = conversationHistory.scrollHeight;
        }

        function appendLLMMessage(text) {
            llmMessageCount++;
            const row = document.createElement('div');
            row.className = 'message-row llm';
            row.id = `llm-msg-${llmMessageCount}`;
            activeLlmMessageId = row.id;
            console.log('[DOM] appendLLMMessage: creating', row.id, 'with textLen=', text.length);
            row.innerHTML = `<div class="message-bubble"><div class="message-label">LLM</div><div class="message-text">${escapeHtml(text)}</div><button class="copy-btn" onclick="copyMessage('${row.id}')" title="Copy to clipboard">📋</button></div>`;
            conversationHistory.appendChild(row);
            const divider = document.createElement('div');
            divider.className = 'message-divider';
            conversationHistory.appendChild(divider);
            conversationHistory.scrollTop = conversationHistory.scrollHeight;
        }

        function updateUserMessage(seq, text) {
            let msgEl = null;
            if (lastUserMessageId) {
                msgEl = document.getElementById(lastUserMessageId);
            }
            if (!msgEl) {
                userMessageCount++;
                const row = document.createElement('div');
                row.className = 'message-row user';
                row.id = `user-msg-${userMessageCount}`;
                row.innerHTML = `<div class="message-bubble"><div class="message-label">User</div><div class="message-text">${escapeHtml(text)}</div><button class="copy-btn" onclick="copyMessage('${row.id}')" title="Copy to clipboard">📋</button></div>`;
                conversationHistory.appendChild(row);
                lastUserMessageId = `user-msg-${userMessageCount}`;
                msgEl = row;
            }
            const textEl = msgEl.querySelector('.message-text');
            textEl.textContent = text;
            conversationHistory.scrollTop = conversationHistory.scrollHeight;
        }

        function copyMessage(elementId) {
            const msgEl = document.getElementById(elementId);
            if (!msgEl) return;
            const textEl = msgEl.querySelector('.message-text');
            if (!textEl) return;
            const text = textEl.textContent || textEl.innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = msgEl.querySelector('.copy-btn');
                if (btn) {
                    const original = btn.textContent;
                    btn.textContent = '✅';
                    setTimeout(() => { btn.textContent = original; }, 1500);
                }
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
            });
        }

        function finalizeUserMessage() {
            lastUserMessageId = null;
        }

        function updateLLMStreaming(seq, text) {
            let msgEl = null;
            if (activeLlmMessageId) {
                msgEl = document.getElementById(activeLlmMessageId);
            }
            const llmMsgs = Array.from(conversationHistory.querySelectorAll('.message-row.llm')).map(el => ({
                id: el.id,
                text: el.querySelector('.message-text')?.textContent?.substring(0, 50) || '(empty)'
            }));
            console.log('[LLM-STREAM] updateLLMStreaming:', { 
                activeLlmMessageId, msgEl: msgEl ? msgEl.id : 'null', 
                llmMessageCount, textLen: text.length, 
                allLlmMsgs: llmMsgs, 
                domChildren: conversationHistory.children.length,
                expectedTextLen: text.length
            });
            if (!msgEl) {
                console.log('[LLM-STREAM] Creating new LLM message (no active element found)');
                appendLLMMessage(text);
                setLLMCursor(true);
                return;
            }
            const textEl = msgEl.querySelector('.message-text');
            if (!textEl) {
                console.log('[LLM-STREAM] WARNING: found element but no .message-text child, creating new message instead');
                appendLLMMessage(text);
                setLLMCursor(true);
                return;
            }
            textEl.textContent = text;
            conversationHistory.scrollTop = conversationHistory.scrollHeight;
        }

        function createMessageRow(className, id, labelText, text) {
            const row = document.createElement('div');
            row.className = className;
            row.id = id;
            row.innerHTML = `<div class="message-bubble"><div class="message-label">${labelText}</div><div class="message-text">${escapeHtml(text)}</div></div>`;
            conversationHistory.appendChild(row);
            conversationHistory.scrollTop = conversationHistory.scrollHeight;
            return row;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearHistory() {
            conversationHistory.innerHTML = '';
            if (llmHistory) llmHistory.innerHTML = '';
            activeLlmMessageId = null;
            lastUserMessageId = null;
        }

        function clearPendingAudioBuffers() {
            pendingAudioBuffers = [];
            currentTurnId = 0;
        }

        function setLLMCursor(show) {
             const currentMsg = activeLlmMessageId ? document.getElementById(activeLlmMessageId) : null;
             if (!currentMsg) return;
             let cursor = currentMsg.querySelector('.cursor');
             if (show) {
                 if (!cursor) {
                     cursor = document.createElement('span');
                     cursor.className = 'cursor';
                     const textEl = currentMsg.querySelector('.message-text');
                     if (textEl) {
                         textEl.appendChild(cursor);
                     }
                 }
             } else if (cursor) {
                 cursor.remove();
             }
         }

        // Audio capture
        async function startAudioCapture() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('Microphone not supported in this browser. Please use a modern browser with HTTPS or localhost.');
                return;
            }
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: 16000
                });
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,
                        sampleRate: 16000,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                const source = audioContext.createMediaStreamSource(mediaStream);
                processor = audioContext.createScriptProcessor(1024, 1, 1);

                processor.onaudioprocess = (e) => {
                    if (!ws || ws.readyState !== WebSocket.OPEN) return;
                    const inputData = e.inputBuffer.getChannelData(0);
                    const float32Data = new Float32Array(inputData.length);
                    for (let i = 0; i < inputData.length; i++) {
                        float32Data[i] = inputData[i];
                    }
                    const int16Data = new Int16Array(float32Data.length);
                    for (let i = 0; i < float32Data.length; i++) {
                        const s = Math.max(-1, Math.min(1, float32Data[i]));
                        int16Data[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }
                    ws.send(int16Data.buffer);
                };

                source.connect(processor);
                processor.connect(audioContext.destination);
            } catch (err) {
                console.error('Audio capture error:', err);
                let msg = 'Microphone error: ';
                if (err.name === 'NotAllowedError') {
                    msg += 'Permission denied. Please allow microphone access in your browser settings.';
                } else if (err.name === 'NotFoundError') {
                    msg += 'No microphone found. Please connect a microphone.';
                } else if (err.name === 'SecurityError') {
                    msg += 'Microphone access requires HTTPS or localhost.';
                } else {
                    msg += err.message || 'Unknown error';
                }
                alert(msg);
            }
        }

        function stopAudioCapture() {
            if (processor) {
                processor.disconnect();
                processor = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
        }

        // Audio playback with sequence-based ordering
        async function initPlaybackContext() {
            if (!audioContextForPlayback) {
                audioContextForPlayback = new (window.AudioContext || window.webkitAudioContext)();
                console.log('[AUDIO] Created AudioContext, state:', audioContextForPlayback.state);
            }
            if (audioContextForPlayback.state === 'suspended') {
                try {
                    await audioContextForPlayback.resume();
                    console.log('[AUDIO] AudioContext resumed, state:', audioContextForPlayback.state);
                } catch (err) {
                    console.error('[AUDIO] Failed to resume AudioContext:', err);
                }
            }
        }

        async function enqueueAudioChunk(base64Data, seq) {
            if (!base64Data) {
                console.log('[AUDIO] enqueueAudioChunk: no data, skipping');
                return;
            }
            console.log('[AUDIO] enqueueAudioChunk: seq=', seq, 'dataLen=', base64Data.length);
            
            await initPlaybackContext();
            if (audioContextForPlayback.state === 'suspended') {
                try {
                    await audioContextForPlayback.resume();
                } catch (err) {
                    console.error('[AUDIO] Failed to resume:', err);
                }
            }

            const binaryString = atob(base64Data);
            const uint8 = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                uint8[i] = binaryString.charCodeAt(i);
            }
            const samples = new Float32Array(uint8.buffer, uint8.byteOffset, uint8.byteLength / 4);
            console.log('[AUDIO] Decoded samples:', samples.length);

            const buffer = audioContextForPlayback.createBuffer(1, samples.length, 16000);
            buffer.getChannelData(0).set(samples);

            pendingAudioBuffers.push({ buffer, seq });
            console.log('[AUDIO] pendingAudioBuffers now has', pendingAudioBuffers.length, 'items');
            sortAndPlayPending();
        }

        function sortAndPlayPending() {
            console.log('[AUDIO] sortAndPlayPending: pending=', pendingAudioBuffers.length, 'expected=', expectedNextSeq, 'queue=', audioQueue.length, 'playing=', isPlaying);
            if (pendingAudioBuffers.length === 0) {
                console.log('[AUDIO] sortAndPlayPending: no pending, returning');
                return;
            }

            pendingAudioBuffers.sort((a, b) => a.seq - b.seq);
            console.log('[AUDIO] sorted pending first item seq:', pendingAudioBuffers[0]?.seq);

            let moved = 0;
            while (pendingAudioBuffers.length > 0 && pendingAudioBuffers[0].seq === expectedNextSeq) {
                const item = pendingAudioBuffers.shift();
                audioQueue.push(item.buffer);
                expectedNextSeq++;
                moved++;
            }
            console.log('[AUDIO] moved', moved, 'items to queue. expectedNextSeq now:', expectedNextSeq, 'queue now:', audioQueue.length, 'pending now:', pendingAudioBuffers.length);

            if (!isPlaying && audioQueue.length > 0) {
                console.log('[AUDIO] starting playNextBuffer');
                playNextBuffer().catch(e => console.error('[AUDIO] playNextBuffer error:', e));
            }
        }

        async function playNextBuffer() {
            console.log('[AUDIO] playNextBuffer: queue=', audioQueue.length, 'contextState=', audioContextForPlayback ? audioContextForPlayback.state : 'none', 'dest=', audioContextForPlayback ? audioContextForPlayback.destination : 'none');
            if (audioQueue.length === 0) {
                console.log('[AUDIO] playNextBuffer: queue empty, stopping');
                isPlaying = false;
                llmStatus.textContent = 'Idle';
                return;
            }

            // Ensure context is running
            if (audioContextForPlayback && audioContextForPlayback.state === 'suspended') {
                try {
                    await audioContextForPlayback.resume();
                    console.log('[AUDIO] Context resumed in playNextBuffer');
                } catch (err) {
                    console.error('[AUDIO] Failed to resume in playNextBuffer:', err);
                }
            }

            isPlaying = true;
            llmStatus.textContent = 'Speaking...';
            startBtn.classList.add('speaking');

            currentAudioBuffer = audioQueue.shift();
            console.log('[AUDIO] playing buffer with', currentAudioBuffer ? currentAudioBuffer.length : 0, 'samples');
            if (audioSource) {
                try { audioSource.stop(); } catch(e) {}
            }

            audioSource = audioContextForPlayback.createBufferSource();
            audioSource.buffer = currentAudioBuffer;
            audioSource.connect(audioContextForPlayback.destination);

            audioSource.onended = async () => {
                console.log('[AUDIO] audioSource.onended fired');
                audioSource = null;
                currentAudioBuffer = null;
                await playNextBuffer().catch(e => console.error('[AUDIO] playNextBuffer error:', e));
            };

            audioSource.start();
            console.log('[AUDIO] audioSource.start() called');
        }

        function stopPlayback() {
            console.log('[AUDIO] stopPlayback called, queue=', audioQueue.length, 'pending=', pendingAudioBuffers.length, 'playing=', isPlaying);
            if (audioSource) {
                try { audioSource.stop(); } catch(e) {}
                audioSource = null;
            }
            audioQueue = [];
            pendingAudioBuffers = [];
            currentAudioBuffer = null;
            isPlaying = false;
            currentTurnId = 0;
            previousTurnId = 0;
            llmStatus.textContent = 'Idle';
            startBtn.classList.remove('speaking');
            console.log('[AUDIO] stopPlayback done');
        }

        function resetConversation() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'reset' }));
            }
            llmMessageCount = 0;
            userMessageCount = 0;
            currentPartialText = '';
            currentPartialSeq = -1;
            clearHistory();
            stopPlayback();
            llmStatus.textContent = 'Waiting';
            setLLMCursor(false);
            isLLMResponding = false;
            currentTurnId = 0;
            previousTurnId = 0;
            activeLlmMessageId = null;
            lastUserMessageId = null;
            turnSeqStart = {};
        }

        // Settings management
        const defaultSettings = {
            tts_voice: 'eric',
            sample_rate: 16000,
            system_prompt: '',
            wake_word: false,
            tts_instruct: 'Speak in a calm, natural conversational tone.',
        };

        let settings = { ...defaultSettings };

        function loadSettings() {
            const saved = localStorage.getItem('jarvis_settings');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    settings = { ...defaultSettings, ...parsed };
                } catch (e) {
                    console.warn('Failed to load settings:', e);
                }
            }
            syncSettingsToUI();
            applySettings();
        }

        function saveSettings() {
            localStorage.setItem('jarvis_settings', JSON.stringify(settings));
        }

        function syncSettingsToUI() {
            const voiceSelect = document.getElementById('tts-voice');
            const voiceCustom = document.getElementById('tts-voice-custom');
            const sampleRateSelect = document.getElementById('audio-sample-rate');
            const systemPromptTextarea = document.getElementById('system-prompt');
            const wakeWordToggle = document.getElementById('wake-word-toggle');
            const ttsInstructInput = document.getElementById('tts-instruct');

            if (voiceSelect && voiceCustom) {
                const voiceOptions = ['eric', 'sarah', 'james', 'emma'];
                if (voiceOptions.includes(settings.tts_voice)) {
                    voiceSelect.value = settings.tts_voice;
                    voiceCustom.style.display = 'none';
                } else {
                    voiceSelect.value = 'custom';
                    voiceCustom.style.display = 'block';
                    voiceCustom.value = settings.tts_voice;
                }
            }

            if (sampleRateSelect) {
                sampleRateSelect.value = settings.sample_rate.toString();
            }

            if (systemPromptTextarea) {
                systemPromptTextarea.value = settings.system_prompt;
            }

            if (wakeWordToggle) {
                wakeWordToggle.checked = settings.wake_word;
            }

            if (ttsInstructInput) {
                ttsInstructInput.value = settings.tts_instruct;
            }
        }

        function updateSetting(key, value) {
            settings[key] = value;
            saveSettings();
            applySettings();

            if (ws && ws.readyState === WebSocket.OPEN) {
                const message = { type: 'set_settings' };
                if (key === 'tts_voice') {
                    message.voice = value;
                    ws.send(JSON.stringify(message));
                } else if (key === 'sample_rate') {
                    message.sample_rate = parseInt(value);
                    ws.send(JSON.stringify(message));
                } else if (key === 'system_prompt') {
                    message.system_prompt = value;
                    ws.send(JSON.stringify(message));
                } else if (key === 'wake_word') {
                    message.wake_word = value;
                    ws.send(JSON.stringify(message));
                } else if (key === 'tts_instruct') {
                    message.tts_instruct = value;
                    ws.send(JSON.stringify(message));
                }
            }
        }

        function applySettings() {
            console.log('Applying settings:', settings);
        }

        function toggleSettings() {
            const overlay = document.getElementById('settings-overlay');
            if (overlay) {
                overlay.style.display = overlay.style.display === 'flex' ? 'none' : 'flex';
            }
        }

        // Export conversation
        function exportConversation() {
            const messages = conversationHistory.querySelectorAll('.message-row');
            if (messages.length === 0) {
                alert('No conversation to export.');
                return;
            }
            let exportText = 'Jarvis Conversation Export\n';
            exportText += '========================\n\n';
            messages.forEach((msg, idx) => {
                const isUser = msg.classList.contains('user');
                const label = isUser ? 'User' : 'LLM';
                const text = msg.querySelector('.message-text')?.textContent || '';
                exportText += `${label}:\n${text}\n\n`;
            });
            const blob = new Blob([exportText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `jarvis_conversation_${new Date().toISOString().slice(0, 10)}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Load settings when page loads
        window.addEventListener('DOMContentLoaded', loadSettings);

        // WebSocket connections
        function connectVAD() {
            ws = new WebSocket(VAD_WS_URL);

            ws.onopen = () => {
                console.log('VAD WebSocket connected');
                const dot = document.getElementById('dot-websocket');
                if (dot) {
                    dot.className = 'service-dot idle';
                }
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('[WS] Received message:', data.type, data);

                switch (data.type) {
                    case 'user_transcript':
                    case 'user_partial':
                        if (data.type === 'user_partial') {
                            currentPartialText = data.text;
                            updateUserMessage(data.chunk_id || 0, data.text);
                        } else {
                            updateUserMessage(data.chunk_id || 0, data.text);
                            finalizeUserMessage();
                            currentPartialText = '';
                        }
                        break;

                    case 'llm_transcript':
                          console.log('[WS] llm_transcript:', { final: data.final, partial: data.partial, turn_id: data.turn_id, textLen: data.text?.length, activeLlmMessageId, llmMessageCount });
                          if (data.final) {
                              console.log('[WS] llm_transcript FINAL: updating existing message or creating fallback');
                              if (activeLlmMessageId) {
                                  const msgEl = document.getElementById(activeLlmMessageId);
                                  if (msgEl) {
                                      console.log('[WS] llm_transcript FINAL: found active message element, setting text');
                                      const textEl = msgEl.querySelector('.message-text');
                                      if (textEl) {
                                          textEl.textContent = data.text;
                                      } else {
                                          console.log('[WS] llm_transcript FINAL: no .message-text, creating new message');
                                          appendLLMMessage(data.text);
                                      }
                                      setLLMCursor(false);
                                  } else {
                                      console.log('[WS] llm_transcript FINAL: activeLlmMessageId element not in DOM, creating new message');
                                      appendLLMMessage(data.text);
                                      setLLMCursor(false);
                                  }
                              } else {
                                  console.log('[WS] llm_transcript FINAL: no activeLlmMessageId, creating new message');
                                  appendLLMMessage(data.text);
                                  setLLMCursor(false);
                              }
                              isLLMResponding = false;
                          } else if (data.partial) {
                              updateLLMStreaming(data.turn_id !== undefined ? data.turn_id : -1, data.text);
                              isLLMResponding = true;
                          }
                          break;

                    case 'llm_audio':
                        console.log('[AUDIO] Received llm_audio:', {
                            turn_id: data.turn_id,
                            audio_seq: data.audio_seq,
                            audio_len: data.audio ? data.audio.length : 0,
                            audio_sample: data.audio ? data.audio.substring(0, 100) : 'none',
                            expectedNextSeq,
                            currentTurnId,
                            previousTurnId,
                            pendingAudioBuffers: pendingAudioBuffers.length,
                            audioQueue: audioQueue.length,
                            isPlaying
                        });
                        if (data.turn_id !== undefined) {
                            if (data.turn_id !== currentTurnId) {
                                console.log('[AUDIO] Turn switch detected:', { oldTurnId: currentTurnId, newTurnId: data.turn_id });
                                clearPendingAudioBuffers();
                                previousTurnId = currentTurnId;
                            }
                            currentTurnId = data.turn_id;
                        }
                        let audioSeq = data.audio_seq !== undefined ? data.audio_seq : expectedNextSeq;
                        if (turnSeqStart[currentTurnId] !== undefined) {
                            audioSeq += turnSeqStart[currentTurnId];
                        }
                        console.log('[AUDIO] About to enqueue:', { seq: audioSeq, expectedNextSeq, bufferLen: data.audio?.length });
                        enqueueAudioChunk(data.audio, audioSeq);
                        console.log('[AUDIO] After enqueue:', { expectedNextSeq, audioQueue: audioQueue.length, pendingAudioBuffers: pendingAudioBuffers.length });
                        break;

                    case 'user_start':
                        userStatus.textContent = 'Listening...';
                        userMessageCount = 0;
                        llmMessageCount = 0;
                        currentPartialText = '';
                        currentPartialSeq = -1;
                        clearHistory();
                        break;

                    case 'user_end':
                        userStatus.textContent = 'Processing...';
                        break;

                    case 'llm_start':
                          console.log('[WS] llm_start: received', { turn_id: data.turn_id, activeLlmMessageId, llmMessageCount, allLlmMsgs: Array.from(conversationHistory.querySelectorAll('.message-row.llm')).map(el => el.id) });
                          currentTurnId = data.turn_id || 0;
                          previousTurnId = 0;
                          turnSeqStart[currentTurnId] = expectedNextSeq;
                          clearPendingAudioBuffers();
                          // Only remove the currently streaming message (activeLlmMessageId != null means still generating)
                          // If activeLlmMessageId is null, the previous turn's message is already finalized and stays in DOM
                          if (activeLlmMessageId) {
                              const oldMsg = document.getElementById(activeLlmMessageId);
                              if (oldMsg && conversationHistory.contains(oldMsg)) {
                                  console.log('[WS] llm_start: removing streaming message', activeLlmMessageId);
                                  oldMsg.remove();
                                  const oldDivider = oldMsg.nextElementSibling;
                                  if (oldDivider && oldDivider.classList.contains('message-divider')) {
                                      oldDivider.remove();
                                  }
                              } else {
                                  console.log('[WS] llm_start: streaming message element stale, removing all LLM msgs');
                                  const staleMsgs = Array.from(conversationHistory.querySelectorAll('.message-row.llm'));
                                  const staleDivs = Array.from(conversationHistory.querySelectorAll('.message-divider'));
                                  staleMsgs.forEach(m => m.remove());
                                  staleDivs.forEach(d => d.remove());
                              }
                          } else {
                              const existingLlmMsgs = Array.from(conversationHistory.querySelectorAll('.message-row.llm'));
                              console.log('[WS] llm_start: no active message (prev turn already ended), keeping', existingLlmMsgs.length, 'existing LLM message(s)');
                          }
                          activeLlmMessageId = null;
                          console.log('[WS] llm_start: done, remaining llmMsgs:', conversationHistory.querySelectorAll('.message-row.llm').length);
                          llmStatus.textContent = 'Thinking...';
                          isLLMResponding = true;
  			console.log("Reached llmMessageCount: " + String(llmMessageCount))
                          break;

                    case 'llm_end':
                        console.log('[WS] llm_end: received', { turn_id: data.turn_id, activeLlmMessageId, llmMessageCount });
                        llmStatus.textContent = 'Idle';
                        console.log('[AUDIO] llm_end: currentTurnId=', currentTurnId, 'previousTurnId=', previousTurnId, 'expectedNextSeq=', expectedNextSeq, 'pending=', pendingAudioBuffers.length, 'queue=', audioQueue.length);
                        if (data.turn_id) {
                            previousTurnId = data.turn_id;
                            turnSeqStart[data.turn_id] = expectedNextSeq;
                        }
                        const llmMsgEl = activeLlmMessageId ? document.getElementById(activeLlmMessageId) : null;
                        if (llmMsgEl) {
                            console.log('[WS] llm_end: found active message, clearing cursor');
                            setLLMCursor(false);
                            const textEl = llmMsgEl.querySelector('.message-text');
                            if (textEl && textEl.textContent.trim() === '') {
                                const textFromServer = data.text || '';
                                if (textFromServer) {
                                    textEl.textContent = textFromServer;
                                } else {
                                    console.log('[WS] llm_end: message empty, removing from DOM');
                                    llmMsgEl.remove();
                                    const divider = llmMsgEl.nextElementSibling;
                                    if (divider && divider.classList.contains('message-divider')) {
                                        divider.remove();
                                    }
                                    llmMessageCount = Math.max(0, llmMessageCount - 1);
                                }
                            }
                        }
                        activeLlmMessageId = null;
                        break;

                    case 'interrupt':
                        stopPlayback();
                        currentPartialText = '';
                        isLLMResponding = false;
                        currentTurnId = 0;
                        previousTurnId = 0;
                        turnSeqStart = {};
                        break;

                    case 'audio_complete':
                        console.log('[AUDIO] audio_complete received:', { turn_id: data.turn_id, lastAudioCompleteSeq });
                        if (data.turn_id) {
                            previousTurnId = data.turn_id;
                        }
                        if (data.turn_id) {
                            lastAudioCompleteSeq = expectedNextSeq;
                            turnSeqStart[data.turn_id] = lastAudioCompleteSeq;
                        }
                        break;

                    case 'service_status':
                        const svc = data.service;
                        const svcStatus = data.status;
                        const dot = document.getElementById(`dot-${svc}`);
                        if (dot) {
                            dot.className = 'service-dot';
                            if (svcStatus === 'active') {
                                dot.classList.add('active');
                            } else if (svcStatus === 'idle') {
                                dot.classList.add('idle');
                            } else {
                                dot.classList.add('offline');
                            }
                        }
                        if (serviceLastHeartbeat[svc] !== undefined) {
                            resetServiceHeartbeat(svc);
                            startServiceHeartbeatTimeout(svc);
                        }
                        break;

                    case 'reset_complete':
                        llmMessageCount = 0;
                        userMessageCount = 0;
                        currentPartialText = '';
                        currentPartialSeq = -1;
                        clearHistory();
                        stopPlayback();
                        setLLMCursor(false);
                        isLLMResponding = false;
                        currentTurnId = 0;
                        previousTurnId = 0;
                        break;
                }
            };

            ws.onclose = () => {
                console.log('VAD WebSocket disconnected, reconnecting...');
                userStatus.textContent = 'Reconnecting...';
                const dot = document.getElementById('dot-websocket');
                if (dot) {
                    dot.className = 'service-dot offline';
                }
                setTimeout(connectVAD, 2000);
            };

            ws.onerror = (err) => {
                console.error('VAD WebSocket error:', err);
            };
        }

        // Main toggle
        startBtn.addEventListener('click', async () => {
            if (!isRunning) {
                isRunning = true;
                startBtn.textContent = 'Stop';
                startBtn.classList.add('active', 'listening');
                userStatus.textContent = 'Starting...';
                llmStatus.textContent = 'Waiting';

                await startAudioCapture();
                connectVAD();
                 } else {
                isRunning = false;
                startBtn.textContent = 'Start';
                startBtn.classList.remove('active', 'listening', 'speaking');
                userStatus.textContent = 'Inactive';
                llmStatus.textContent = 'Waiting';

                stopAudioCapture();
                stopPlayback();

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'stop' }));
                    ws.send(JSON.stringify({ type: 'interrupt' }));
                }
                
                llmMessageCount = 0;
                userMessageCount = 0;
                currentPartialText = '';
                currentPartialSeq = -1;
                clearHistory();
                setLLMCursor(false);
                isLLMResponding = false;
                currentTurnId = 0;
                previousTurnId = 0;
            }
        });
    </script>
</body>
</html>
